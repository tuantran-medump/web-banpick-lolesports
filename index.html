<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Thống kê ban/pick tướng LoL chuyên nghiệp theo giải, phiên bản, phe và đội." />
    <title>Banpick LoL</title>
    <script>
      // Áp giao diện đã chọn trước khi vẽ trang để không bị nháy màu.
      try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
