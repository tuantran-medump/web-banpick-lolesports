name: Cập nhật dữ liệu

on:
  schedule:
    # Google hay báo "Quota exceeded" với file của Oracle's Elixir, nên thử 3 tiếng một lần.
    # Hôm nay đã tải được rồi thì các lần sau tự bỏ qua.
    - cron: "15 */3 * * *"
  workflow_dispatch:
    inputs:
      years:
        description: "Các năm cần tải, cách nhau bằng dấu cách (để trống = năm trước và năm nay)"
        required: false
        default: ""
  push:
    # Tự đưa CSV (hoặc .zip) lên thư mục manual/ thì workflow chuyển đổi rồi xóa file đó đi
    branches: [main]
    paths: ["manual/**"]
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Chạy test
        run: python -m unittest discover -s tests -v

      - name: Hôm nay đã cập nhật chưa
        id: today
        run: |
          today=$(date -u +%Y-%m-%d)
          last=$(python -c "import json;print(json.load(open('public/data/meta.json'))['updated'])" 2>/dev/null || echo "")
          echo "Lần cập nhật gần nhất: ${last:-chưa có}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$today" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Hôm nay đã cập nhật, bỏ qua."
          fi

      # CSV của lần tải thành công gần nhất được giữ trong cache. Năm nào hôm nay không tải
      # được thì dùng lại bản cũ, nên dữ liệu các năm khác không bị mất.
      - name: Lấy CSV đã lưu
        if: steps.today.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: raw
          key: oe-csv-${{ github.run_id }}
          restore-keys: oe-csv-

      - name: Chọn năm
        if: steps.today.outputs.skip != 'true'
        id: years
        env:
          INPUT_YEARS: ${{ github.event.inputs.years }}
          VAR_YEARS: ${{ vars.OE_YEARS }}
        run: |
          y=$(date -u +%Y)
          years="${INPUT_YEARS:-${VAR_YEARS:-$((y - 1)) $y}}"
          [[ "$years" =~ ^[0-9\ ]+$ ]] || { echo "::error::Danh sách năm không hợp lệ: $years"; exit 1; }
          echo "Năm: $years"
          echo "years=$years" >> "$GITHUB_OUTPUT"

      - name: Lấy CSV (tự đưa lên hoặc tải từ Oracle's Elixir)
        if: steps.today.outputs.skip != 'true'
        id: download
        env:
          OE_DRIVE_FOLDER_ID: ${{ vars.OE_DRIVE_FOLDER_ID }}
          OE_FILE_IDS: ${{ vars.OE_FILE_IDS }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          YEARS: ${{ steps.years.outputs.years }}
        run: |
          mkdir -p raw
          (cd raw && md5sum *.csv 2>/dev/null) > before.md5 || true
          if [ "${{ github.event_name }}" = "push" ]; then
            python scripts/oe_manual.py manual raw
          else
            python scripts/oe_download.py $YEARS --dir raw --optional
          fi
          (cd raw && md5sum *.csv 2>/dev/null) > after.md5 || true
          ls -l raw
          if ! cmp -s before.md5 after.md5 && [ -s after.md5 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Hôm nay chưa có CSV mới của Oracle's Elixir, thử Leaguepedia."
          fi

      - name: Dự phòng Leaguepedia
        if: steps.today.outputs.skip != 'true' && steps.download.outputs.ok != 'true'
        id: lp
        timeout-minutes: 6
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        env:
          LP_BOT_USER: ${{ secrets.LP_BOT_USER }}
          LP_BOT_PASSWORD: ${{ secrets.LP_BOT_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args="--out build/lp-test"   # PR: chỉ chạy thử, không đụng public/data
          else
            args=""
          fi
          if python -u scripts/lp_fallback.py --data public/data $args 2> >(tee lp-report.txt >&2); then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            {
              echo '## Leaguepedia (dự phòng)'
              echo '```'
              cat lp-report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::error::Không lấy được dữ liệu từ cả Oracle's Elixir và Leaguepedia"
            exit 1
          fi
          # Không lấy được từ cả hai nguồn: giữ nguyên dữ liệu, chờ lần sau hoặc chờ bạn tự đưa CSV lên manual/
          echo "::warning::Leaguepedia cũng lỗi. Giữ nguyên dữ liệu cũ, sẽ thử lại lần sau."

      - name: Chuyển CSV sang JSON
        if: steps.download.outputs.ok == 'true'
        run: |
          python scripts/oe_convert.py raw/*.csv --out build/data 2> build-report.txt || { cat build-report.txt; exit 1; }
          cat build-report.txt
          python scripts/oe_check.py public/data/index.json build/data/index.json
          rm -rf public/data
          mkdir -p public
          mv build/data public/data
          python scripts/oe_meta.py raw public/data/meta.json
          du -sh public/data
          {
            echo '## Báo cáo dữ liệu'
            echo '```'
            cat build-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lưu CSV vào cache
        if: steps.download.outputs.ok == 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: raw
          key: oe-csv-${{ github.run_id }}

      - name: Commit dữ liệu mới
        if: github.event_name != 'pull_request' && (steps.download.outputs.ok == 'true' || steps.lp.outputs.ok == 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data
          if [ "${{ github.event_name }}" = "push" ] && [ -d manual ]; then
            git rm -rq --ignore-unmatch manual   # file tự đưa lên đã dùng xong
          fi
          if git diff --cached --quiet; then
            echo "Dữ liệu không đổi, không commit."
            exit 0
          fi
          if [ "${{ steps.download.outputs.ok }}" = "true" ]; then src="Oracle's Elixir"; else src="Leaguepedia (dự phòng)"; fi
          git commit -m "data: cập nhật từ $src $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            git push && exit 0
            sleep $((2 ** i))
            git pull --rebase
          done
          exit 1

      - name: Xem trước thay đổi (PR, không commit)
        if: github.event_name == 'pull_request' && steps.download.outputs.ok == 'true'
        run: git status --short public/data | head -50
